<div
  class="rounded-base border-default-medium text-body w-max max-w-full border bg-white px-3 py-2.5 text-xs leading-relaxed shadow-xl select-text"
  [id]="panelId()"
  role="tooltip"
>
  @if (contentTemplate(); as template) {
    <ng-container [ngTemplateOutlet]="template" />
  } @else {
    {{ contentText() }}
  }
</div>
